version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: karyadrishti-db
    environment:
      POSTGRES_USER: karyadrishti
      POSTGRES_PASSWORD: karyadrishti_dev_password
      POSTGRES_DB: karyadrishti_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U karyadrishti -d karyadrishti_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: karyadrishti-backend
    environment:
      DATABASE_URL: postgresql://karyadrishti:karyadrishti_dev_password@db:5432/karyadrishti_db
      JWT_SECRET: dev_secret_key_change_in_production
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./ml:/app/ml

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: karyadrishti-frontend
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
